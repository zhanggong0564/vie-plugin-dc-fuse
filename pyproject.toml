[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vie-plugin-dc-fuse"
version = "0.1.0"
description = "VIE 直流熔丝检测插件"
requires-python = ">=3.10"
# 生产环境应声明依赖 "vie-framework"；in-repo demo 用 --no-deps 安装，
# 框架的 services/schemas/routers 由仓库根目录在 sys.path 上提供。
dependencies = []

[project.entry-points."vie.plugins"]
dc_fuse = "vie_plugin_dc_fuse.plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["vie_plugin_dc_fuse*"]
